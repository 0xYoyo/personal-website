# Cloudflare Worker for Yoyo's agent (the mind). See README.md for the full deploy walkthrough.
name = "yoyo-agent"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Optional: serve from your own domain instead of *.workers.dev (README step 9).
# routes = [{ pattern = "agent.example.com", custom_domain = true }]

# `wrangler dev` (npm run dev:live): the address apps/web/.env.development calls
[dev]
ip = "127.0.0.1"
port = 8787

[vars]
# Comma-separated list of site origins allowed to call /chat, /build and /share.
# A `*` matches any run of characters except "/" (so "http://localhost:*" covers every local port).
ALLOWED_ORIGINS = "http://localhost:*,http://127.0.0.1:*"
# Which model answers (README "Switching the model"): "gemini" (default) or "anthropic".
PROVIDER = "gemini"
# MODEL = "gemini-2.5-flash"   # optional; default gemini-3.1-flash-lite, or claude-sonnet-4-5 with PROVIDER = "anthropic"
# Live replies (the router) per UTC day: for the whole site, and per visitor IP. Past either, the site is scripted for the day.
DAILY_CHAT_CAP = "150"
CHAT_PER_IP_DAY = "20"
# Builds never call the model (the site streams its prebuilt examples). "on" turns live builds back on.
LIVE_BUILDS = "off"
DAILY_BUILD_CAP = "300"
DAILY_SHARE_CAP = "1000"

# KV namespaces. Replace the placeholder ids with the ids printed by
#   npx wrangler kv namespace create SHARES
#   npx wrangler kv namespace create LIMITS
[[kv_namespaces]]
binding = "SHARES"
id = "722b52a599a64c0faa36b4cc02b2be95"

[[kv_namespaces]]
binding = "LIMITS"
id = "34b14af3115b46218299844c9cde032a"

# Secrets (never in this file):
#   npx wrangler secret put GEMINI_API_KEY      (PROVIDER = "gemini")
#   npx wrangler secret put ANTHROPIC_API_KEY   (PROVIDER = "anthropic")
#   npx wrangler secret put IP_SALT        (optional; any random string)
