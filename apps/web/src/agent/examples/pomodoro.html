<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro</title>
<style>
  :root { --bg:#f3efe7; --ink:#1a1714; --muted:#857d72; --accent:#d9472b; --line:rgba(26,23,20,.12); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display:grid; place-items:center; }
  main { width:min(92vw, 520px); text-align:center; }
  .modes { display:inline-flex; gap:4px; padding:4px; border:1px solid var(--line); border-radius:999px; }
  .modes button { border:0; background:none; font:inherit; font-size:14px; padding:8px 16px; border-radius:999px; color:var(--muted); cursor:pointer; }
  .modes button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  .clock { position:relative; width:min(80vw, 340px); aspect-ratio:1; margin:28px auto 20px; }
  svg { width:100%; height:100%; transform:rotate(-90deg); }
  circle { fill:none; stroke-width:6; }
  .track { stroke:var(--line); }
  .arc { stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .4s linear; }
  .digits { position:absolute; inset:0; display:grid; place-items:center; font-variant-numeric:tabular-nums;
    font-size:clamp(56px, 16vw, 88px); font-weight:650; letter-spacing:-.03em; }
  .digits small { display:block; font-size:14px; font-weight:500; letter-spacing:0; color:var(--muted); margin-top:-6px; }
  .row { display:flex; gap:10px; justify-content:center; }
  .row button { font:inherit; font-size:15px; padding:12px 22px; border-radius:12px; border:1px solid var(--line); background:none; cursor:pointer; color:var(--ink); }
  .row button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); min-width:120px; }
  .row button:focus-visible, .modes button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  p.keys { color:var(--muted); font-size:13px; margin-top:22px; }
  kbd { font-family:ui-monospace, monospace; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
  .dots { display:flex; gap:6px; justify-content:center; margin-top:16px; }
  .dots i { width:8px; height:8px; border-radius:50%; background:var(--line); }
  .dots i.on { background:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="modes" role="group" aria-label="Mode">
    <button data-mode="focus" aria-pressed="true">Focus 25</button>
    <button data-mode="break" aria-pressed="false">Break 5</button>
  </div>
  <div class="clock">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="54"></circle>
      <circle class="arc" cx="60" cy="60" r="54" stroke-dasharray="339.3" stroke-dashoffset="0"></circle>
    </svg>
    <div class="digits"><div><span id="t" aria-live="polite">25:00</span><small id="m">focus</small></div></div>
  </div>
  <div class="row">
    <button class="primary" id="go">Start</button>
    <button id="reset">Reset</button>
  </div>
  <div class="dots" aria-label="Completed focus sessions"><i></i><i></i><i></i><i></i></div>
  <p class="keys"><kbd>Space</kbd> start or pause · <kbd>R</kbd> reset · <kbd>B</kbd> switch</p>
</main>
<script>
  const LEN = { focus: 25 * 60, break: 5 * 60 };
  let mode = 'focus', left = LEN.focus, timer = null, done = 0, end = 0;
  const $ = (s) => document.querySelector(s);
  const arc = $('.arc'), C = 339.3;
  function fmt(s) { const m = Math.floor(s / 60), r = s % 60; return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0'); }
  function paint() {
    $('#t').textContent = fmt(left);
    $('#m').textContent = mode;
    arc.style.strokeDashoffset = String(C * (1 - left / LEN[mode]));
    document.title = fmt(left) + ' · ' + mode;
    document.querySelectorAll('.dots i').forEach((d, i) => d.classList.toggle('on', i < done % 5));
    document.querySelectorAll('.modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    $('#go').textContent = timer ? 'Pause' : left === LEN[mode] ? 'Start' : 'Resume';
  }
  function tick() {
    left = Math.max(0, Math.round((end - Date.now()) / 1000));
    if (left === 0) { stop(); if (mode === 'focus') done++; setMode(mode === 'focus' ? 'break' : 'focus'); beep(); }
    paint();
  }
  function start() { end = Date.now() + left * 1000; timer = setInterval(tick, 250); paint(); }
  function stop() { clearInterval(timer); timer = null; paint(); }
  function toggle() { timer ? stop() : start(); }
  function reset() { stop(); left = LEN[mode]; paint(); }
  function setMode(m) { stop(); mode = m; left = LEN[m]; paint(); }
  function beep() {
    try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain();
      o.frequency.value = 660; g.gain.setValueAtTime(0.2, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.6);
      o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 0.6); } catch (e) {}
  }
  $('#go').onclick = toggle; $('#reset').onclick = reset;
  document.querySelectorAll('.modes button').forEach((b) => b.onclick = () => setMode(b.dataset.mode));
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'b' || e.key === 'B') setMode(mode === 'focus' ? 'break' : 'focus');
  });
  paint();
</script>
</body>
</html>
