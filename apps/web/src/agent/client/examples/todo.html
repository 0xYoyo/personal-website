<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today</title>
<style>
  :root {
    --bg: #f6f4ef; --surface: #ffffff; --fg: #1a1815; --muted: #6f6a62; --line: #e4e0d8; --accent: #2b4bff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121110; --surface: #1b1a18; --fg: #f1ede6; --muted: #9c958b; --line: #2c2a27; --accent: #4d69ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 40px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 40px; letter-spacing: -0.03em; margin: 0; }
  .date { color: var(--muted); margin: 4px 0 24px; }
  .add { display: flex; gap: 8px; }
  .add input {
    flex: 1; min-width: 0; min-height: 50px; padding: 0 16px; font: inherit; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  button { font: inherit; cursor: pointer; }
  .add button { min-height: 50px; padding: 0 20px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 8px; gap: 12px; flex-wrap: wrap; }
  .filters { display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
  .filters button { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; min-height: 40px; border-radius: 999px; font-size: 14px; }
  .filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .count { color: var(--muted); font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  ul:empty { display: none; }
  li { display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 14px; border-top: 1px solid var(--line); min-height: 56px; }
  li:first-child { border-top: 0; }
  .check { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); margin: 0; flex: none; cursor: pointer; display: grid; place-items: center; }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { content: ""; width: 10px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
  .text { flex: 1; min-width: 0; overflow-wrap: anywhere; padding: 8px 0; }
  li.done .text { color: var(--muted); text-decoration: line-through; }
  .text[contenteditable="true"] { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; padding: 8px 6px; }
  .del { border: 0; background: transparent; color: var(--muted); width: 44px; height: 44px; border-radius: 10px; font-size: 20px; line-height: 1; }
  .del:hover { background: var(--bg); color: var(--fg); }
  .empty:empty { display: none; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .link { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 10px 0; }
  .link:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>Today</h1>
  <p class="date" id="date"></p>
  <div class="add">
    <label for="new" style="position:absolute;left:-9999px">New task</label>
    <input id="new" placeholder="Add a task and press Enter" autocomplete="off" maxlength="140">
    <button type="button" id="add">Add</button>
  </div>
  <div class="bar">
    <div class="filters" role="group" aria-label="Filter">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="active" aria-pressed="false">Active</button>
      <button type="button" data-f="done" aria-pressed="false">Done</button>
    </div>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <ul id="list"></ul>
  <p class="empty" id="empty"></p>
  <div class="foot">
    <span>Double-click a task to edit it.</span>
    <button type="button" class="link" id="clear">Clear done</button>
  </div>
</main>
<script>
(() => {
  const KEY = 'today.tasks.v1';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) { /* storage is optional */ } };
  let tasks = load() || [
    { id: 1, text: 'Reply to the design review thread', done: true },
    { id: 2, text: 'Ship the settings page', done: false },
    { id: 3, text: 'Book a table for Thursday', done: false },
  ];
  let filter = 'all';
  const $ = (id) => document.getElementById(id);
  $('date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  function render() {
    const list = $('list');
    list.textContent = '';
    const shown = tasks.filter((t) => filter === 'all' || (filter === 'done' ? t.done : !t.done));
    shown.forEach((t) => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.className = 'check'; cb.checked = t.done; cb.setAttribute('aria-label', 'Done: ' + t.text);
      cb.addEventListener('change', () => { t.done = cb.checked; save(); render(); });
      const span = document.createElement('span');
      span.className = 'text'; span.textContent = t.text;
      span.addEventListener('dblclick', () => edit(span, t));
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', 'Delete ' + t.text);
      del.addEventListener('click', () => { tasks = tasks.filter((x) => x !== t); save(); render(); });
      li.append(cb, span, del);
      list.appendChild(li);
    });
    const left = tasks.filter((t) => !t.done).length;
    $('count').textContent = left === 0 ? (tasks.length ? 'All done.' : '') : left + (left === 1 ? ' task left' : ' tasks left');
    $('empty').textContent = shown.length ? '' : filter === 'done' ? 'Nothing finished yet.' : filter === 'active' ? 'Nothing left. Nice.' : 'No tasks. Add one above.';
    $('clear').disabled = !tasks.some((t) => t.done);
    document.querySelectorAll('.filters button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === filter)));
  }

  function edit(span, t) {
    span.contentEditable = 'true'; span.focus();
    const range = document.createRange(); range.selectNodeContents(span);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    const finish = (keep) => {
      span.contentEditable = 'false';
      const v = span.textContent.trim();
      if (keep && v) t.text = v.slice(0, 140);
      save(); render();
    };
    span.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') finish(false);
    });
    span.addEventListener('blur', () => finish(true), { once: true });
  }

  function add() {
    const input = $('new');
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    tasks.unshift({ id: Date.now(), text: v.slice(0, 140), done: false });
    input.value = '';
    if (filter === 'done') filter = 'all';
    save(); render(); input.focus();
  }
  $('add').addEventListener('click', add);
  $('new').addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
  $('clear').addEventListener('click', () => { tasks = tasks.filter((t) => !t.done); save(); render(); });
  document.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => { filter = b.dataset.f; render(); }));
  render();
})();
</script>
</body>
</html>
